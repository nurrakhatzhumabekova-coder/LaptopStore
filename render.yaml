services:
  - type: web
    name: laptopstore
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn core.wsgi
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: laptopstore-db
          property: connectionString

databases:
  - name: laptopstore-db
    plan: free